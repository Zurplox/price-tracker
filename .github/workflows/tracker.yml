name: 💰 Price Tracker

on:
  schedule:
    - cron: "0 20 * * *"     # 4:00 AM Singapore time, every day (GitHub uses UTC; 04:00 SGT = 20:00 UTC)
  workflow_dispatch:          # lets the dashboard's "Run check now" button work

permissions:
  contents: write             # save price history + product status back to this repo

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Real browser for JavaScript-heavy / bot-protected shops (Shopee, Lazada…)
      - run: python -m playwright install --with-deps chromium

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}   # optional backup layer
        run: python tracker.py

      - name: Save results
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add products.json prices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update prices"
          # The dashboard can commit (product adds) while a run is in progress —
          # rebase onto the latest main and retry a few times before giving up.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
