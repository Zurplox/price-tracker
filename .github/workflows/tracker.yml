name: 💰 Price Tracker

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC). "7 * * * *" = hourly.
  workflow_dispatch:          # lets the dashboard's "Run check now" button work

permissions:
  contents: write             # save price history + product status back to this repo

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Real browser for JavaScript-heavy / bot-protected shops (Shopee, Lazada…)
      - run: python -m playwright install --with-deps chromium

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}   # optional backup layer
        run: python tracker.py

      - name: Save results
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add products.json prices.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push
