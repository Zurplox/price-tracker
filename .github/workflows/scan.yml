name: 🔍 Scan prices

on:
  workflow_dispatch:
    inputs:
      scan_url:
        description: "URL to scan — leave empty to scan ALL tracked links in one run"
        required: false
        type: string
      market_url:
        description: "URL to market-check: your link's price + other sellers (takes priority over scan_url)"
        required: false
        type: string
      market_name:
        description: "Search term for the market check (defaults to the product name)"
        required: false
        type: string

permissions:
  contents: write             # write scan results back to this repo

concurrency:
  group: price-scan           # spammed scans queue up instead of colliding
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Scan or market-check
        env:
          SCAN_URL: ${{ inputs.scan_url }}
          MARKET_URL: ${{ inputs.market_url }}
          MARKET_NAME: ${{ inputs.market_name }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scan.py

      - name: Save scan results
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add scans.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update scan results"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
